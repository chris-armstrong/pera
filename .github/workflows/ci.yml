name: CI

on:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          dune-cache: true
          opam-local-packages: ""

      - name: Install dependencies
        run: |
          opam install -y \
            containers yojson \
            eio eio_main eio_linux \
            piaf re \
            alcotest qcheck-alcotest qcheck-core

      - name: Install semgrep
        run: pip install semgrep --quiet

      - name: Semgrep lint
        run: semgrep --config .semgrep/ocaml-guidelines.yml lib/ bin/ --error

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest
